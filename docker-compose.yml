version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: iez-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iez_user
      POSTGRES_PASSWORD: iez_password
      POSTGRES_DB: iez_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iez_user -d iez_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: iez-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://iez_user:iez_password@postgres:5432/iez_db
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-secure-random-string}
      - DEBUG=${DEBUG:-True}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8080
    volumes:
      - ./backend:/app
      - ./utils:/app/utils
      - upload_temp:/tmp/iez_uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development
    container_name: iez-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_API_PROXY=http://backend:8000
      - VITE_WS_PROXY=ws://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --host

  # Nginx Reverse Proxy (Production setup)
  nginx:
    image: nginx:alpine
    container_name: iez-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  upload_temp:
    driver: local

networks:
  default:
    name: iez-network
