name: Deploy to iez.co.in

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -f -X POST https://iez.co.in/api/deploy \
            -H "X-Hub-Signature-256: sha256=$(echo -n '' | openssl dgst -sha256 -hmac '${{ secrets.DEPLOY_SECRET }}' | sed 's/.*= //')" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 360 \
            -w "\nHTTP %{http_code}\n"
